[pytest]
# Pytest configuration for Meeting Minutes Generator

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    # Verbose output
    -v
    # Show extra test summary info
    -ra
    # Show local variables in tracebacks
    --showlocals
    # Show warnings
    --strict-markers
    # Disable warnings from third-party libraries
    --disable-warnings
    # Coverage options (when running with --cov)
    --cov-report=html
    --cov-report=term-missing
    --cov-branch

# Markers (custom test categories)
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests (require external services)
    unit: marks tests as unit tests (isolated, no external dependencies)
    gpu: marks tests that require GPU/CUDA (skip if not available)
    requires_api: marks tests that require API credentials (Gemini, Notion)

# Logging
log_cli = false
log_cli_level = INFO
log_file = tests/pytest.log
log_file_level = DEBUG

# Coverage minimum threshold (will fail if coverage below this)
# Disabled for now, enable after reaching target coverage
# fail_under = 50

# Ignore directories
norecursedirs =
    .git
    .venv
    venv
    env
    __pycache__
    .pytest_cache
    htmlcov
    uploads
    .claude
    specs

# Timeout for tests (prevent hanging)
# Requires pytest-timeout: pip install pytest-timeout
# timeout = 300

# Parallel execution (requires pytest-xdist)
# Enable with: pytest -n auto
# Requires: pip install pytest-xdist
# addopts = -n auto
